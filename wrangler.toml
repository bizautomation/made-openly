name = "madeopenly"
main = "src/index.js"
compatibility_date = "2026-10-28"

# Served only on the custom domains. workers.dev and preview URLs stay off.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "madeopenly.com", custom_domain = true },
  { pattern = "www.madeopenly.com", custom_domain = true },
  # Owner-only review mirror, behind Cloudflare Access, never indexed.
  { pattern = "madeopenly.bizat.co", custom_domain = true },
]

# Self-hosted Inter (no third-party font requests). Files here are served
# directly; every other path goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS" # the Worker serves the pre-drawn PNG badges from public/png/
# The share image goes through the Worker so it gets a long cache header.
run_worker_first = ["/og.png"]

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFp0lfRK9ZmT16dL" # public; the secret is set with wrangler secret put
# Pages a Turnstile token may come from (siteverify hostname). Local dev adds
# localhost in .dev.vars; it never belongs here.
TURNSTILE_HOSTNAMES = "madeopenly.com,www.madeopenly.com,madeopenly.bizat.co"
MAIL_FROM = "Made Openly <we@madeopenly.com>" # Resend sender. RESEND_API_KEY, ADMIN_EMAIL, ADMIN_SIGNING_KEY, KEY_SECRET and GITHUB_TOKEN (optional) are secrets

[[d1_databases]]
binding = "DB"
database_name = "madeopenly"
database_id = "8b865803-b237-4d15-a96e-e63af9f16be4"
migrations_dir = "migrations"

[triggers]
# Mondays 02:00 UTC: weekly verification. Every 15 minutes: first check of new places (SPEC.md 8.3).
crons = ["0 2 * * 1", "*/15 * * * *"]

# Rate limits (SPEC.md 9). The binding only supports 10 s or 60 s windows,
# so these are per-minute limits; longer windows are zone WAF rules.
# Keys are the client IP, held in memory by the limiter only, never stored.
[[ratelimits]]
name = "RL_GENERATE"
namespace_id = "62801"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_BADGE"
namespace_id = "62802"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "RL_CONTACT"
namespace_id = "62803"
  [ratelimits.simple]
  limit = 1
  period = 60

[[ratelimits]]
name = "RL_LIST"
namespace_id = "62804"
  [ratelimits.simple]
  limit = 3
  period = 60

# Badge key: open, remove, list (manage page). 3 key emails per IP per
# minute here; the hourly window is a zone WAF rule like the others.
[[ratelimits]]
name = "RL_KEY"
namespace_id = "62805"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_SENDKEY"
namespace_id = "62806"
  [ratelimits.simple]
  limit = 3
  period = 60
