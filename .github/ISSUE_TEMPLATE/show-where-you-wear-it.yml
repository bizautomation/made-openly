name: Show where you wear it
description: Tell us a page that wears a Made Openly badge.
title: "Wearing it: "
labels: ["wearing-it"]
body:
  - type: markdown
    attributes:
      value: "Issues are public. Only share a page you are happy to show."
  - type: input
    id: page
    attributes:
      label: Page address
      placeholder: https://example.com/about
    validations:
      required: true
  - type: dropdown
    id: label
    attributes:
      label: Which label
      options:
        - Mostly AI
        - Human + AI
        - Human only
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything you want to tell us
    validations:
      required: false
